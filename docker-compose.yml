services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kalla8426
      POSTGRES_DB: APIRateLimiter
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"